id: polifonia_xv
tema: Polifonía del siglo XV
verificado: false
revisado_con: "Revisión docente del 11-10-2026. Josquin y el siglo XVI se tratan en la sesión siguiente."

# Puntos que el profesor debe cotejar en Atlas / Reese antes de marcar verificado: true
cotejar:
  - "Ockeghem, Missa Fors seulement, y Obrecht, Missa Fortuna desperata: confirmar en Atlas qué voces de la chanson modelo toman."
  - "Ockeghem, Missa De plus en plus, sobre la chanson de Binchois: confirmar en Atlas o Reese."
  - "Himnos de Du Fay: confirmar la paráfrasis del canto llano en el superius."
  - "Descripción de las cadencias de Landini y de salto de octava: cotejar con Atlas."
  - "Tarea 1: comprobar en la partitura si el tenor calla en el Christe."
  - "Tarea 3: comprobar si la frase atribuida a Reese es literal."

infografia:
  titulo: "Modelos de misa y técnicas compositivas del siglo XV"
  subtitulo: "Del material preexistente a la misa cíclica · Du Fay · Binchois · Ockeghem · Busnois"
  modelos_misa:
    - nombre: "Misa de cantus firmus"
      disposicion: "Superius, Altus, TENOR (melodía preexistente en valores largos), Bassus"
      caracteristicas:
        - "Melodía preexistente fija en valores largos (aumentación)."
        - "Generalmente asignada al Tenor."
        - "Las otras voces tejen contrapunto libre."
        - "La misma melodía recorre los cinco movimientos y unifica el ciclo."
      ejemplo: "Du Fay, Missa Se la face ay pale"
      ejemplo_descripcion: "El tenor de su propia balada en valores aumentados; en el Gloria se expone tres veces, en proporciones 3:1, 2:1 y 1:1. Las misas L'homme armé de Du Fay, Ockeghem o Busnois siguen el mismo principio y toman su título de la melodía en la que se basan."
    - nombre: "Paráfrasis"
      disposicion: "Melodía preexistente ornamentada en la voz superior"
      caracteristicas:
        - "La melodía original sigue siendo reconocible, pero con glosas y adornos."
        - "En el siglo XV suele situarse en el superius."
        - "Más libertad rítmica y melódica que el cantus firmus."
        - "Su reparto entre todas las voces por imitación se verá en el siglo XVI."
      ejemplo: "Du Fay, himnos del ciclo litúrgico"
      ejemplo_descripcion: "El canto llano, ornamentado, en el superius, a menudo con fauxbourdon."
    - nombre: "Misas sobre varias voces de una chanson"
      disposicion: "Chanson modelo (varias voces) -> Misa nueva"
      caracteristicas:
        - "Toman del modelo más de una voz, no solo el tenor."
        - "Combinan las voces tomadas con contrapunto nuevo."
        - "Son el precedente de la misa parodia o de imitación del siglo XVI."
      ejemplo: "Ockeghem, Missa Fors seulement · Obrecht, Missa Fortuna desperata"
      ejemplo_descripcion: "Reelaboran varias voces de la chanson que da título a la misa."

  tecnicas:
    paso_1:
      titulo: "Selección del material preexistente"
      descripcion: "El compositor parte de una melodía o de una obra ya conocida, que suele dar nombre a la misa."
      origen_sacro:
        tipo: "Canto llano / gregoriano"
        generos: ["Himnos", "Antífonas", "Cantos litúrgicos"]
        ejemplos: ["Ave regina caelorum", "Ave maris stella", "Veni Creator Spiritus"]
      origen_profano:
        tipo: "Chansons y melodías populares"
        generos: ["Chansons cortesanas", "Melodías populares muy difundidas"]
        ejemplos: ["L'homme armé", "Se la face ay pale", "De plus en plus", "Fortuna desperata"]
    paso_2:
      titulo: "Elección de la técnica de tratamiento"
      descripcion: "Diferentes maneras de integrar el material en la misa."
      procedimientos:
        - nombre: "Cantus firmus"
          detalles: ["Aislar la melodía.", "Estirar sus notas (aumentación).", "Situarla normalmente en el Tenor.", "Rodearla de contrapunto libre."]
          resultado: "Melodía fija como columna vertebral de la obra."
        - nombre: "Paráfrasis"
          detalles: ["Ornamentar la melodía (glosas).", "Modificar su ritmo.", "Situarla normalmente en la voz superior."]
          resultado: "Melodía transformada pero reconocible."
        - nombre: "Varias voces del modelo"
          detalles: ["Tomar más de una voz de la chanson.", "Combinarlas con contrapunto nuevo."]
          resultado: "Precedente de la misa parodia del siglo XVI."
    paso_3:
      titulo: "Unificación de la misa cíclica"
      descripcion: "Recursos para dar coherencia a toda la obra (Kyrie, Gloria, Credo, Sanctus, Agnus Dei)."
      recursos:
        - nombre: "Técnica del motto"
          subtitulo: "Motivo de cabeza"
          detalles:
            - "Todas las secciones del Ordinario comienzan con el mismo motivo en las voces superiores."
            - "En Du Fay se combina con el cantus firmus para reforzar la unidad del ciclo."
        - nombre: "Cadencias del siglo XV"
          subtitulo: "De Landini y de salto de octava"
          detalles:
            - "Cadencia de Landini: en la voz superior, la sensible baja al sexto grado antes de subir a la octava (7-6-8)."
            - "Cadencia de salto de octava: mientras superius y tenor van de la sexta a la octava, el contratenor salta una octava ascendente para evitar quintas paralelas."
            - "La sonoridad final suele ser vacía: octava y quinta, sin tercera."

conceptos:
  - termino: "Cantus firmus"
    categoria: "TÉCNICA"
    definicion: "Melodía preexistente (canto llano o canción profana) empleada como eje estructural de una nueva composición polifónica, asignada tradicionalmente al Tenor en valores largos."
  - termino: "Aumentación rítmica"
    categoria: "RITMO"
    definicion: "Alargamiento proporcional de las duraciones de la melodía original (al doble o al triple), que da al Tenor un ritmo lento frente a las voces más activas."
  - termino: "Misa cíclica"
    categoria: "FORMA"
    definicion: "Misa polifónica en la que los cinco movimientos del Ordinario (Kyrie, Gloria, Credo, Sanctus, Agnus Dei) comparten material unificador. Suele titularse por ese material: Missa L'homme armé, Missa Se la face ay pale."
  - termino: "Técnica del motto"
    categoria: "RECURSO"
    definicion: "Recurso de unificación que consiste en iniciar cada movimiento del Ordinario con el mismo motivo en las voces superiores (motivo de cabeza)."
  - termino: "Isorritmia"
    categoria: "TÉCNICA"
    definicion: "Organización del tenor, y a veces de otras voces, mediante la repetición de un patrón rítmico (talea) y otro melódico (color) de distinta longitud. Típica del motete de ceremonia, como Nuper rosarum flores de Du Fay."
  - termino: "Formes fixes"
    categoria: "GÉNERO"
    definicion: "Estructuras poético-musicales consolidadas en el siglo XIV que dominaron la chanson cortesana del XV: rondeau (ABaAabAB), ballade (aabC) y virelai / bergerette (AbbaA)."
  - termino: "Contenance angloise"
    categoria: "LENGUAJE"
    definicion: "Sonoridad de terceras y sextas de influencia inglesa (Dunstable) que adoptaron Du Fay y Binchois. El término procede del poeta Martin le Franc."
  - termino: "Flujo continuo"
    categoria: "ESTILO"
    definicion: "Rasgo del estilo de Ockeghem: evita las cesuras cadenciales simultáneas superponiendo y encadenando frases melódicas independientes."

tareas_adicionales_casa:
  - id: "tarea_1"
    tag: "PARTITURA"
    titulo: "Rastreo auditivo y analítico del cantus firmus"
    objetivo: "Seguir en la partitura el Kyrie de la Missa Se la face ay pale de Du Fay e identificar el Tenor."
    instrucciones:
      - "Subraya en la partitura los compases de entrada del Tenor."
      - "Calcula cuántos compases dura cada nota del Tenor frente al ritmo de Superius y Altus."
      - "Comprueba si el cantus firmus calla en alguna sección, como el Christe."
  - id: "tarea_2"
    tag: "FORMA POÉTICA"
    titulo: "Diagrama formal de un rondeau"
    objetivo: "Comprender la arquitectura de las formes fixes a partir de De plus en plus de Binchois."
    instrucciones:
      - "Esquematiza el rondeau aplicando el molde ABaAabAB."
      - "Señala qué secciones repiten el estribillo completo (música y texto) y cuáles repiten solo la música con texto nuevo."
  - id: "tarea_3"
    tag: "ESTILO Y TEXTURA"
    titulo: "Matriz comparativa de estilo: Du Fay frente a Ockeghem"
    objetivo: "Contrastar la estética y la técnica de las dos generaciones."
    instrucciones:
      - "Completa una tabla comparando: 1) formación de las frases, 2) tesituras y registro de las voces, 3) cadencias simultáneas y 4) imitación."
      - "Explica por qué Reese describe el estilo de Ockeghem como una evitación deliberada de la articulación de las frases."
  - id: "tarea_4"
    tag: "CONSOLIDACIÓN"
    titulo: "Cuestionario de conceptos clave del siglo XV"
    objetivo: "Afianzar los conceptos teóricos de la unidad."
    instrucciones:
      - "¿Qué diferencia una misa de cantus firmus de una misa basada en varias voces de una chanson?"
      - "¿Qué significaba elegir una melodía profana, como L'homme armé o Se la face ay pale, como base de una misa?"
      - "¿Qué función estructural cumplía el motto o motivo de cabeza?"

