# Tema tal como lo escribiría el profesor (con erratas/variantes habituales)
topic: "Polifonia franco-flamenca del s. xv: Dufay, Binchois e Ockehem"

# Criterios pedagógicos del profesor con indicaciones detalladas y erratas deliberadas
teacher_criteria: >
  Analizar las generaciones franco-flamencas del siglo XV borgoñon e internacional.
  Primera generacion borgoñona con Guillaume Du Fay y Gilles Binchois: transicion desde el
  Ars Subtilior, influencia de la contenance angloise de Dunstaple (3as y 6as paralelas),
  chansons en formes fixes (rondeau, ballade, virelai) y creacion de la misa ciclica sobre cantus firmus profano (Se la face ay pale, L'homme arme).
  Segunda generacion: Johannes Ockeghem, ensanchamiento del registro grave hacia el Bassus,
  estilo de flujo continuo evitando cadencias simultaneas, y tecnicas de canon y misa prolacionum.
  Diferenciar tecnicas de composicion de misa: cantus firmus, parafrasis y misa parodia o imitacion.
  En el aula el alumnado debe comparar auditivamente un rondeau de Binchois con un movimiento de misa de Dufay y Ockeghem.
